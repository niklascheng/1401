<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Logo Gradients -->
    <linearGradient id="apple-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <linearGradient id="term-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#161f33" />
    </linearGradient>

    <linearGradient id="divider-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="20%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="70%" stop-color="#818cf8" stop-opacity="1" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.3" />
    </linearGradient>

    <!-- Apple Silhouette Clip Path (170x170 coordinate space) -->
    <clipPath id="apple-clip">
      <!-- Leaf -->
      <path d="M117.71 32.32c0-7.39 2.62-14.28 7.85-20.66 5.23-6.38 11.67-10.15 19.32-11.32.11 1.09.16 2.04.16 2.85 0 7.39-2.73 14.36-8.19 20.91-5.46 6.55-12.03 10.27-19.71 11.16-.27-1.3-.43-2.6-.43-3.94z" />
      <!-- Body -->
      <path d="M150.37 130.25c-2.45 5.66-5.35 10.87-8.71 15.66-4.58 6.53-8.33 11.05-11.22 13.56-4.48 4.12-9.28 6.23-14.42 6.35-3.69 0-8.14-1.05-13.32-3.18-5.19-2.12-9.97-3.17-14.34-3.17-4.58 0-9.49 1.05-14.75 3.17-5.26 2.13-9.5 3.24-12.74 3.35-4.35.13-9.1-1.9-14.24-6.08-3.91-3.26-7.85-8.08-11.82-14.45-6.03-9.76-10.67-20.32-13.92-31.69-3.25-11.37-4.88-22.25-4.88-32.64 0-14.15 3.61-25.31 10.83-33.48 7.22-8.17 16.32-12.33 27.3-12.49 4.78 0 9.92 1.25 15.42 3.75 5.5 2.5 9.07 3.75 10.72 3.75 2.07 0 5.92-1.39 11.55-4.18 5.64-2.78 10.72-4.04 15.25-3.79 10.3 1.09 18.52 5.34 24.66 12.76-8.91 5.36-13.22 12.98-12.94 22.86.33 11.66 4.45 20.93 12.36 27.81 7.91 6.89 17.15 10.45 27.72 10.68-1.55 4.67-3.53 9.47-5.94 12.41z" />
    </clipPath>
  </defs>

  <!-- Centered Apple: scale=2.7, translate(26, 26) -->
  <g transform="translate(26, 26) scale(2.7)">
    <g clip-path="url(#apple-clip)">
      <!-- LEFT HALF: COLOR TERMINAL (x: 0 to 88.5) -->
      <rect x="0" y="0" width="88.5" height="170" fill="url(#term-dark)" />

      <!-- Scanlines -->
      <line x1="0" y1="50" x2="88.5" y2="50" stroke="#ffffff" stroke-opacity="0.04" stroke-width="0.5" />
      <line x1="0" y1="55" x2="88.5" y2="55" stroke="#ffffff" stroke-opacity="0.04" stroke-width="0.5" />
      <line x1="0" y1="60" x2="88.5" y2="60" stroke="#ffffff" stroke-opacity="0.04" stroke-width="0.5" />
      <line x1="0" y1="65" x2="88.5" y2="65" stroke="#ffffff" stroke-opacity="0.04" stroke-width="0.5" />
      <line x1="0" y1="70" x2="88.5" y2="70" stroke="#ffffff" stroke-opacity="0.04" stroke-width="0.5" />
      <line x1="0" y1="75" x2="88.5" y2="75" stroke="#ffffff" stroke-opacity="0.04" stroke-width="0.5" />
      <line x1="0" y1="80" x2="88.5" y2="80" stroke="#ffffff" stroke-opacity="0.04" stroke-width="0.5" />
      <line x1="0" y1="85" x2="88.5" y2="85" stroke="#ffffff" stroke-opacity="0.04" stroke-width="0.5" />
      <line x1="0" y1="90" x2="88.5" y2="90" stroke="#ffffff" stroke-opacity="0.04" stroke-width="0.5" />
      <line x1="0" y1="95" x2="88.5" y2="95" stroke="#ffffff" stroke-opacity="0.04" stroke-width="0.5" />
      <line x1="0" y1="100" x2="88.5" y2="100" stroke="#ffffff" stroke-opacity="0.04" stroke-width="0.5" />
      <line x1="0" y1="105" x2="88.5" y2="105" stroke="#ffffff" stroke-opacity="0.04" stroke-width="0.5" />
      <line x1="0" y1="110" x2="88.5" y2="110" stroke="#ffffff" stroke-opacity="0.04" stroke-width="0.5" />
      <line x1="0" y1="115" x2="88.5" y2="115" stroke="#ffffff" stroke-opacity="0.04" stroke-width="0.5" />
      <line x1="0" y1="120" x2="88.5" y2="120" stroke="#ffffff" stroke-opacity="0.04" stroke-width="0.5" />
      <line x1="0" y1="125" x2="88.5" y2="125" stroke="#ffffff" stroke-opacity="0.04" stroke-width="0.5" />
      <line x1="0" y1="130" x2="88.5" y2="130" stroke="#ffffff" stroke-opacity="0.04" stroke-width="0.5" />
      <line x1="0" y1="135" x2="88.5" y2="135" stroke="#ffffff" stroke-opacity="0.04" stroke-width="0.5" />
      <line x1="0" y1="140" x2="88.5" y2="140" stroke="#ffffff" stroke-opacity="0.04" stroke-width="0.5" />

      <!-- Terminal Window Traffic Lights -->
      <circle cx="36" cy="58" r="3.2" fill="#ff5f56" stroke="#e0443e" stroke-width="0.4" />
      <circle cx="45" cy="58" r="3.2" fill="#ffbd2e" stroke="#dea123" stroke-width="0.4" />
      <circle cx="54" cy="58" r="3.2" fill="#27c93f" stroke="#1aab29" stroke-width="0.4" />
      <circle cx="35.3" cy="57.2" r="1.1" fill="#ffffff" fill-opacity="0.4" />
      <circle cx="44.3" cy="57.2" r="1.1" fill="#ffffff" fill-opacity="0.4" />
      <circle cx="53.3" cy="57.2" r="1.1" fill="#ffffff" fill-opacity="0.4" />

      <!-- Titlebar Separator -->
      <line x1="25" y1="66" x2="88.5" y2="66" stroke="#1e293b" stroke-width="0.8" />

      <!-- Colorful Terminal Monospace Code Lines -->
      <text x="30" y="78" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="7.2" font-weight="700">
        <tspan fill="#38bdf8">❯</tspan>
        <tspan fill="#f1f5f9" dx="2">hack</tspan>
        <tspan fill="#06b6d4" dx="1">-v</tspan>
      </text>

      <text x="30" y="90" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="6.4" font-weight="600">
        <tspan fill="#4ade80">[OK]</tspan>
        <tspan fill="#cbd5e1" dx="2">OpenCore</tspan>
      </text>

      <text x="30" y="101" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="6.4" font-weight="600">
        <tspan fill="#facc15">[OK]</tspan>
        <tspan fill="#cbd5e1" dx="2">Lilu.kext</tspan>
      </text>

      <text x="30" y="112" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="6.4" font-weight="600">
        <tspan fill="#fb923c">[OK]</tspan>
        <tspan fill="#cbd5e1" dx="2">AppleALC</tspan>
      </text>

      <text x="30" y="123" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="6.4" font-weight="600">
        <tspan fill="#c084fc">[OK]</tspan>
        <tspan fill="#cbd5e1" dx="2">WhateverG</tspan>
      </text>

      <text x="30" y="135" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="6.8" font-weight="700">
        <tspan fill="#38bdf8">mac:~$</tspan>
        <tspan fill="#4ade80" dx="2">&#x2588;</tspan>
      </text>

      <!-- RIGHT HALF: SLEEK METALLIC APPLE LOGO (x: 88.5 to 170) -->
      <rect x="88.5" y="0" width="85" height="170" fill="url(#apple-metal)" />

      <!-- Center Divider Beam -->
      <line x1="88.5" y1="35" x2="88.5" y2="165" stroke="url(#divider-glow)" stroke-width="1.2" />
    </g>

    <!-- Center Divider Outer Glow -->
    <line x1="88.5" y1="42" x2="88.5" y2="160" stroke="#38bdf8" stroke-width="0.6" stroke-opacity="0.8" />
  </g>
</svg>
